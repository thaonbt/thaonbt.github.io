<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Redirecting…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Main redirect: works even when JavaScript is disabled -->
  <meta http-equiv="refresh" content="0; url=https://profile.thaonbt.workers.dev/">
  <!-- Informs search engines about the new landing page -->
  <link rel="canonical" href="https://profile.thaonbt.workers.dev/">
  <!-- Fallback: does not leave an entry in the history, so the Back button does not get stuck -->
  <script>window.location.replace("https://profile.thaonbt.workers.dev/");</script>
</head>
<body>
  <p>Changing direction to profile site <a href="https://profile.thaonbt.workers.dev/">Click here</a> if the browser doesn't switch automatically.</p>
</body>
</html>
